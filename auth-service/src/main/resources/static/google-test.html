<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Thử đăng nhập Google - DatDo Fishing</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    pre { background: #f2f6f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
<h1>Thử đăng nhập Google</h1>
<p>Trang này chỉ để kiểm tra backend. Mở tại <code>http://localhost:8081/google-test.html</code> và thêm
  <code>http://localhost:8081</code> vào "Authorized JavaScript origins" của OAuth Client trên Google Cloud.</p>
<div id="btn"></div>
<h3>Kết quả</h3>
<pre id="out">Chưa đăng nhập</pre>
<script>
  async function onCredential(resp) {
    const r = await fetch('/api/auth/google', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({idToken: resp.credential})
    });
    document.getElementById('out').textContent = r.status + '\n' + JSON.stringify(await r.json(), null, 2);
  }
  window.onload = async () => {
    const cfg = await (await fetch('/api/auth/google/config')).json();
    if (!cfg.clientId) {
      document.getElementById('out').textContent = 'Chưa cấu hình GOOGLE_CLIENT_ID trong file .env';
      return;
    }
    google.accounts.id.initialize({client_id: cfg.clientId, callback: onCredential});
    google.accounts.id.renderButton(document.getElementById('btn'), {theme: 'outline', size: 'large'});
  };
</script>
</body>
</html>
