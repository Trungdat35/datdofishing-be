# Cần cài ingress-nginx một lần (xem README). Trình duyệt tự hiểu *.localhost là 127.0.0.1.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datdofishing
  annotations:
    # SSE: tắt buffer và giữ kết nối lâu
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
    - host: mail.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mailpit, port: { number: 8025 } }
    - host: rabbit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: rabbitmq, port: { number: 15672 } }
