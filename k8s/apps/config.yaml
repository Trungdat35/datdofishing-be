apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env
data:
  SPRING_PROFILES_ACTIVE: k8s
  DB_HOST: mysql
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  RABBIT_HOST: rabbitmq
  MAIL_HOST: mailpit
  AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  CATALOG_URL: http://catalog-service:8082
  INVENTORY_URL: http://inventory-service:8083
  PROMOTION_URL: http://promotion-service:8086
  AUTH_URI: http://auth-service:8081
  CATALOG_URI: http://catalog-service:8082
  INVENTORY_URI: http://inventory-service:8083
  CART_URI: http://cart-service:8084
  PROMOTION_URI: http://promotion-service:8086
  CONTENT_URI: http://content-service:8087
  NOTIFICATION_URI: http://notification-service:8088
  SHOP_URL: http://localhost:3000
  ADMIN_URL: http://localhost:3001
  PUBLIC_API_URL: http://api.localhost
  JAVA_OPTS: "-Xms128m -Xmx320m -XX:+UseSerialGC"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Điền Client ID Google rồi chạy lại: kubectl apply -k k8s
  GOOGLE_CLIENT_ID: ""
  ADMIN_EMAIL: admin@datdofishing.local
  ADMIN_PASSWORD: Admin@123
