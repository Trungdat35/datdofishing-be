apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: { app: order-service }
spec:
  replicas: 3
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      enableServiceLinks: false
      containers:
        - name: order-service
          image: datdofishing/order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef: { name: app-env }
            - secretRef: { name: app-secret }
          env:
            # Mỗi pod dùng tên pod làm INSTANCE_ID để thấy load balancing
            - name: INSTANCE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: SERVER_PORT
              value: "8085"
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: { app: order-service }
  ports:
    - port: 8085
      targetPort: 8085
