server:
  port: 8088

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: notification_user
    password: notification_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      # lưu mọi thời điểm theo UTC (Instant)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: datdofishing
    password: 123456
    listener:
      simple:
        # Gửi email lỗi thì thử lại 4 lần (2s, 4s, 8s), vẫn lỗi thì đẩy sang dead-letter queue
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 2
        default-requeue-rejected: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  thymeleaf:
    check-template-location: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

datdofishing:
  outbox:
    enabled: true
  mail-from: "DatDo Fishing <no-reply@datdofishing.local>"
  shop-url: ${SHOP_URL:http://localhost:3000}
  admin-url: ${ADMIN_URL:http://localhost:3001}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
