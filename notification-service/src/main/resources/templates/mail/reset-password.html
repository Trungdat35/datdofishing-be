<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title></head>
<body style="margin:0;background:#f2f6f5;font-family:Arial,Helvetica,sans-serif;color:#0c2a33">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0">
  <tr><td align="center">
    <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden">
      <tr><td style="background:#0b3a47;color:#eaf5f4;padding:20px 28px;font-size:20px;font-weight:bold">DATDO FISHING</td></tr>
      <tr><td style="padding:28px">
        <p>Xin chào <b th:text="${fullName}">Khách hàng</b>,</p>
        <p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn.</p>
        <p style="margin:24px 0">
          <a th:href="${resetUrl}" style="background:#f25c2a;color:#ffffff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Đặt lại mật khẩu</a>
        </p>
        <p style="color:#4f656b;font-size:13px">Link có hiệu lực 30 phút và chỉ dùng được một lần. Nếu bạn không yêu cầu, hãy bỏ qua email này.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
