name: Deploy to home server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: F:\Learn\datdofishing-be

jobs:
  deploy:
    runs-on: [self-hosted, windows, datdo-server]
    timeout-minutes: 60
    steps:
      - name: Pull latest code
        shell: powershell
        run: |
          Set-Location "$env:DEPLOY_DIR"
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check .env exists
        shell: powershell
        run: |
          Set-Location "$env:DEPLOY_DIR"
          if (-not (Test-Path .env)) {
            Write-Host "ERROR: .env is missing on the server. Copy .env.example to .env first."
            exit 1
          }

      - name: Build and restart stack
        shell: powershell
        run: |
          Set-Location "$env:DEPLOY_DIR"
          docker compose --profile apps up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Wait for gateway
        shell: powershell
        run: |
          for ($i = 0; $i -lt 120; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://localhost:8080/api/catalog/products -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "Gateway OK"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 10
          }
          Write-Host "ERROR: gateway did not respond within 20 minutes"
          docker compose --profile apps ps
          exit 1
