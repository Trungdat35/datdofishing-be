server:
  port: 8087

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/content_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: content_user
    password: content_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      # lưu mọi thời điểm theo UTC (Instant)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
