server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    loadbalancer:
      # Bỏ qua instance không trả lời /actuator/health
      configurations: health-check
      health-check:
        interval: 10s
    discovery:
      client:
        simple:
          instances:
            order-service:
              - uri: http://localhost:8085

datdofishing:
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  routes:
    auth: ${AUTH_URI:http://localhost:8081}
    catalog: ${CATALOG_URI:http://localhost:8082}
    inventory: ${INVENTORY_URI:http://localhost:8083}
    cart: ${CART_URI:http://localhost:8084}
    order: lb://order-service
    promotion: ${PROMOTION_URI:http://localhost:8086}
    content: ${CONTENT_URI:http://localhost:8087}
    notification: ${NOTIFICATION_URI:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
