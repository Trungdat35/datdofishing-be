server:
  port: 8086

spring:
  application:
    name: promotion-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/promotion_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: promotion_user
    password: promotion_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      # lưu mọi thời điểm theo UTC (Instant)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: promotion-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

datdofishing:
  outbox:
    enabled: true
  catalog-url: ${CATALOG_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
